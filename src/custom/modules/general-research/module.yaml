code: general-research
name: "General Research Module"
header: "General Research Module"
subheader: "Intelligent web research with smart source selection and content refinement"
default_selected: false

# Variables from Core Config inserted:
## user_name
## communication_language
## document_output_language
## output_folder
## bmad_memory

research_output_path:
  prompt: "Where should research outputs be saved?"
  default: ".research"
  result: "{project-root}/{value}"

default_topic_type:
  prompt: "What type of research do you primarily do?"
  default: "technical_documentation"
  result: "{value}"
  single-select:
    - value: "academic_research"
      label: "Academic Research - Scholarly papers, peer-reviewed content"
    - value: "technical_documentation"
      label: "Technical Documentation - Software docs, tutorials, guides"
    - value: "general_knowledge"
      label: "General Knowledge - Wikipedia-style broad information"
    - value: "recipes_lifestyle"
      label: "Recipes & Lifestyle - Recipes, how-tos, lifestyle content"

detail_level:
  prompt: "How detailed should research outputs be?"
  default: "standard"
  result: "{value}"
  single-select:
    - value: "minimal"
      label: "Minimal - Brief summaries only (max 1000 words)"
    - value: "standard"
      label: "Standard - Balanced detail with analysis (max 3000 words)"
    - value: "detailed"
      label: "Detailed - Comprehensive with excerpts (max 10000 words)"

auto_approve_high_reliability:
  prompt: "Auto-approve high-reliability sources (>0.9 score)?"
  default: "false"
  result: "{value}"
  single-select:
    - value: "true"
      label: "Yes - Skip approval for trusted sources"
    - value: "false"
      label: "No - Always approve manually"

# Static configuration values
config_path:
  result: "{project-root}/.general-research"

state_path:
  result: "{project-root}/.general-research/state"

topics_path:
  result: "{project-root}/.general-research/topics"

min_reliability_score:
  result: "0.7"

similarity_threshold:
  result: "0.85"

default_delay_ms:
  result: "2000"

max_retries:
  result: "3"
