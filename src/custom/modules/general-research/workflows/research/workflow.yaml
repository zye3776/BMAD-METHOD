# Research Workflow Configuration
# End-to-end research pipeline with 5 approval checkpoints
name: "research"
description: "End-to-end research pipeline with 5 approval checkpoints for intelligent web research"
author: "General Research Module"

# Critical variables from config
config_source: "{project-root}/_bmad/general-research/config.yaml"
output_folder: "{config_source}:output_folder"
research_output_path: "{config_source}:research_output_path"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
default_topic_type: "{config_source}:default_topic_type"
detail_level: "{config_source}:detail_level"
auto_approve_high_reliability: "{config_source}:auto_approve_high_reliability"
min_reliability_score: "{config_source}:min_reliability_score"
date: system-generated

# Workflow file paths
installed_path: "{project-root}/_bmad/general-research/workflows/research"
template: "{installed_path}/template.md"
instructions: "{installed_path}/instructions.md"

# State management for interrupt/resume capability
state_path: "{project-root}/.general-research/state"
default_output_file: "{research_output_path}/research-{{topic_slug}}-{{date}}.md"

# Sub-workflows for scraping and refinement
scrape_workflow: "{project-root}/_bmad/general-research/workflows/scrape/workflow.yaml"
refine_workflow: "{project-root}/_bmad/general-research/workflows/refine/workflow.yaml"

# Default source hierarchies
source_hierarchies: "{project-root}/_bmad/general-research/data/_default-sources/"

standalone: true

# Approval checkpoint configuration
checkpoints:
  - id: "plan"
    name: "Research Plan Approval"
    step: 2
    options: ["Approve", "Modify", "Cancel"]
  - id: "source_list"
    name: "Source List Approval"
    step: 4
    options: ["Approve All", "Remove", "Add", "Cancel"]
  - id: "quality_check"
    name: "Quality Check"
    step: 6
    options: ["Continue", "Adjust", "Discard"]
  - id: "refinement_plan"
    name: "Refinement Plan Approval"
    step: 8
    options: ["Approve", "Modify", "Skip"]
  - id: "final_review"
    name: "Final Review"
    step: 10
    options: ["Save", "View Full", "Refine More", "Discard"]

# Quality thresholds
quality_thresholds:
  min_reliability_score: 0.7
  min_content_depth_words: 500
  max_duplicate_content_percent: 25
  min_source_diversity: 3
