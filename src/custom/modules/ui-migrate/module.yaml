code: ui-migrate
name: "UI Migration Toolkit"
header: "UI Migration Toolkit"
subheader: "Migrate AI-generated UI code (from Lovable, V0, etc.) into your existing projects"
default_selected: false

# Variables from Core Config inserted:
## user_name
## communication_language
## document_output_language
## output_folder
## bmad_memory

coding_standards_path:
  prompt: "Path to your project's coding standards document (REQUIRED for migration)"
  default: ".docs/coding-standards.md"
  result: "{project-root}/{value}"

migrations_output:
  prompt: "Where should migration documents be saved?"
  default: ".docs/migrations"
  result: "{project-root}/{value}"

test_file_suffix:
  prompt: "Test file suffix for co-located tests"
  default: ".test.tsx"
  result: "{value}"
  single-select:
    - value: ".test.tsx"
      label: ".test.tsx - React Testing Library convention"
    - value: ".spec.tsx"
      label: ".spec.tsx - Jest/Jasmine convention"
    - value: ".test.ts"
      label: ".test.ts - Non-JSX tests"

migration_mode:
  prompt: "Default migration mode (can be changed per migration)"
  default: "auto"
  result: "{value}"
  single-select:
    - value: "auto"
      label: "Auto - Detect based on analysis"
    - value: "refresh"
      label: "Refresh - Update existing UI visuals"
    - value: "addition"
      label: "Addition - Add new UI elements"
    - value: "extraction"
      label: "Extraction - Cherry-pick specific components"

submodule_path:
  prompt: "Default path for AI-generated source code (leave blank to ask each time)"
  default: ""
  result: "{value}"

# Static configuration values
data_path:
  result: "{project-root}/_bmad/ui-migrate/data"

dependencies_note:
  result: "Requires BMM module for architecture workflow integration"
